name: TemPad
options:
  bundleIdPrefix: app.tempad
  deploymentTarget:
    iOS: '17.0'
packages:
  TemPadCore:
    path: Core
settings:
  base:
    SWIFT_VERSION: '5.9'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGNING_ALLOWED: NO
targets:
  TemPad:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: TemPadCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: TemPad
        CFBundleShortVersionString: '$(MARKETING_VERSION)'
        CFBundleVersion: '$(CURRENT_PROJECT_VERSION)'
        UILaunchScreen:
          UIColorName: Background
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Light
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.tempad.ios
        MARKETING_VERSION: '0.2.0'
        CURRENT_PROJECT_VERSION: '1'
  TemPadUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: TemPad
schemes:
  TemPad:
    build:
      targets:
        TemPad: all
        TemPadUITests: [test]
    test:
      targets: [TemPadUITests]
